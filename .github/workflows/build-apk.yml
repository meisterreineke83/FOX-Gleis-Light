name: APK bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - uses: gradle/actions/setup-gradle@v4

      - name: Version lesen
        id: v
        run: echo "version=$(grep '^versionName' tool/lighttool.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - name: APK bauen
        run: |
          chmod +x gradlew
          # Wie Lights eigener Build-Server: Release mit Code-Verkleinerung, nur arm64 (Light Phone III).
          # Signiert mit dem SDK-Entwicklerschlüssel – derselbe wie bisher, Updates klappen also.
          ./gradlew :tool:testReleaseUnitTest :tool:assembleRelease \
            -DlightSdk.toolOnly=true -DlightSdk.abiFilters=arm64-v8a --stacktrace
          cp tool/build/outputs/apk/release/*.apk FOX-Gleis-Light.apk
          ls -la FOX-Gleis-Light.apk

      - name: Release-Text
        run: |
          notes="docs/release-notes/${{ steps.v.outputs.version }}.md"
          if [ -f "$notes" ]; then cp "$notes" release-body.md; else
            printf 'Automatisch gebaut aus %s.\n\nInstallation: siehe README.\n' "${{ github.sha }}" > release-body.md
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: FOX-Gleis-Light-APK
          path: FOX-Gleis-Light.apk

      - name: Als Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: FOX Gleis Light ${{ steps.v.outputs.version }}
          prerelease: false
          make_latest: true
          files: FOX-Gleis-Light.apk
          body_path: release-body.md
